apiVersion: fintlabs.no/v1alpha1
kind: Application
metadata:
  name: fint-core-status-service
  namespace: fint-core
spec:
  port: 8080
  orgId: fintlabs.no
  image: ghcr.io/fintlabs/fint-core-status-service:latest
  kafka:
    enabled: true
    acls:
      - topic: "novari-no.fint-core.fint-felleskomponent-adapter-contract"
        permission: read
      - topic: "novari-no.fint-core.fint-felleskomponent-adapter-heartbeat"
        permission: read
      - topic: "novari-no.fint-core.fint-felleskomponent-adapter-full-sync"
        permission: read
      - topic: "novari-no.fint-core.fint-felleskomponent-adapter-delta-sync"
        permission: read
      - topic: "novari-no.fint-core.fint-felleskomponent-adapter-delete-sync"
        permission: read
      - topic: "novari-no.fint-core.fint-felleskomponent-event-request"
        permission: read
      - topic: "novari-no.fint-core.fint-felleskomponent-event-response"
        permission: read
  observability:
    metrics:
      enabled: true
      port: "8080"
      path: /actuator/prometheus
  database:
    database: fint-core
  ingress:
    routes:
      - host: core-status-beta.fintlabs.no
        path: /
  env:
    - name: fint.status.enabled
      value: "false"
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:+ExitOnOutOfMemoryError -Xmx525M'
  resources:
    limits:
      memory: "5Gi"
    requests:
      memory: "1Gi"
      cpu: "250m"